name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP (Composer)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Install Quosheets dependencies (Anthropic PHP SDK)
        run: composer install --no-dev --no-interaction --no-progress --prefer-dist --optimize-autoloader --working-dir=php/quosheets

      - name: Deploy via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: >-
            -avzr --delete
            --exclude='.git*'
            --exclude='.github'
            --exclude='node_modules'
            --exclude='.env'
            --exclude='.env.*'
            --exclude='README.md'
            --exclude='*.local.php'
            --exclude='img/fpv-uploads/*'
          path: ./
          remote_path: ${{ secrets.SSH_TARGET_PATH }}
          remote_host: ${{ secrets.SSH_HOST }}
          remote_port: ${{ secrets.SSH_PORT }}
          remote_user: ${{ secrets.SSH_USER }}
          remote_key: ${{ secrets.SSH_PRIVATE_KEY }}
