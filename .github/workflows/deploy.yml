name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect build output (static site if none)
        id: build
        run: |
          if [ -f package.json ]; then
            echo "package.json found — installing dependencies and building."
            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi
            npm run build --if-present

            if [ -d dist ]; then
              echo "dir=dist" >> "$GITHUB_OUTPUT"
            elif [ -d build ]; then
              echo "dir=build" >> "$GITHUB_OUTPUT"
            else
              echo "No dist/ or build/ output found after build — falling back to repo root."
              echo "dir=." >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No package.json — static site, publishing repo root."
            echo "dir=." >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=yes" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='README.md' \
            --exclude='*.local.php' \
            "${{ steps.build.outputs.dir }}/" \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_PATH }}/"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
